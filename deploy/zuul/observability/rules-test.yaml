    {
      "name": "stuck check",
      "interval": "1m",
      "input_series": [
        {
          "series": "ci_stuck_check_runs",
          "values": "1+0x10"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "6m",
          "alertname": "CIStuckCheckRun",
          "exp_alerts": [
            {
              "exp_labels": {},
              "exp_annotations": {
                "summary": "GitHub check remains open after its Zuul buildset finished"
              }
            }
          ]
        }
      ]
    },
    {
      "name": "broken scan",
      "interval": "1m",
      "input_series": [
        {
          "series": "ci_observer_scan_ok{scan=\"checks\"}",
          "values": "0+0x10"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "6m",
          "alertname": "CIObserverUnavailable",
          "exp_alerts": [
            {
              "exp_labels": {
                "scan": "checks"
              },
              "exp_annotations": {
                "summary": "CI error/check observer is unavailable or cannot complete a scan"
              }
            },
            {
              "exp_labels": {
                "job": "ci-observer"
              },
              "exp_annotations": {
                "summary": "CI error/check observer is unavailable or cannot complete a scan"
              }
            }
          ]
        }
      ]
    },
