          "eval_time": "40m",
          "alertname": "CIComponentErrorRate",
          "exp_alerts": []
        },
        {
          "eval_time": "40m",
          "alertname": "CIStuckCheckRun",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "notification health lifecycle: component errors",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"ci-observer\"}",
          "values": "1+0x46"
        },
        {
          "series": "ci_observer_scan_ok{scan=\"logs\"}",
          "values": "1+0x46"
        },
        {
          "series": "ci_observer_scan_ok{scan=\"checks\"}",
          "values": "1+0x46"
        },
        {
          "series": "ci_component_errors_10m{namespace=\"zuul\",component=\"launcher\"}",
          "values": "0+0x2 6+0x33 0+0x10"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ci:observer_healthy",
          "eval_time": "0m",
          "exp_samples": [
            {
              "labels": "{__name__=\"ci:observer_healthy\"}",
              "value": 1
            }
          ]
        },
        {
          "expr": "ci:observer_healthy",
          "eval_time": "20m",
          "exp_samples": [
            {
              "labels": "{__name__=\"ci:observer_healthy\"}",
              "value": 1
            }
          ]
        },
        {
          "expr": "ci:observer_healthy",
          "eval_time": "34m",
          "exp_samples": [
            {
              "labels": "{__name__=\"ci:observer_healthy\"}",
              "value": 0
            }
          ]
        },
        {
          "expr": "ci:observer_healthy",
          "eval_time": "40m",
          "exp_samples": [
            {
              "labels": "{__name__=\"ci:observer_healthy\"}",
              "value": 1
            }
          ]
        }
      ]
    },
