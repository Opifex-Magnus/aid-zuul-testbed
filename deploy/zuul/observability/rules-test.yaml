  "evaluation_interval": "1m",
  "tests": [
    {
      "name": "zuul/scheduler",
      "interval": "1m",
      "input_series": [
        {
          "series": "ci_component_errors_10m{namespace=\"zuul\",component=\"scheduler\"}",
          "values": "6+0x45"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "29m",
          "alertname": "CIComponentErrorRate",
          "exp_alerts": []
        },
        {
          "eval_time": "31m",
          "alertname": "CIComponentErrorRate",
          "exp_alerts": [
            {
              "exp_labels": {
                "namespace": "zuul",
                "component": "scheduler"
              },
              "exp_annotations": {
                "summary": "CI component logs more than five errors per ten minutes for thirty minutes"
              }
            }
          ]
        }
      ]
    },
