apiVersion: apps/v1
kind: Deployment
metadata: {name: ci-observer}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: ci-observer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ci-observer}
    spec:
      serviceAccountName: ci-observer
      enableServiceLinks: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: observer
          # Reuse the repository's single Zuul image pin for its Python runtime.
          image: quay.io/zuul-ci/zuul-scheduler
          command: [python3, -B, /observer/observer.py]
          env:
            - {name: HTTPS_PROXY, value: 'http://172.31.250.2:3128'}
            - {name: NO_PROXY, value: '.svc,.cluster.local,localhost,127.0.0.1'}
          ports: [{name: metrics, containerPort: 9103}]
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
          resources:
            requests: {cpu: 10m, memory: 32Mi, ephemeral-storage: 8Mi}
            limits: {cpu: 250m, memory: 128Mi, ephemeral-storage: 16Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: code, mountPath: /observer, readOnly: true}
            - {name: github, mountPath: /github, readOnly: true}
      volumes:
        - name: code
          configMap: {name: ci-observer}
        - name: github
          secret: {secretName: ci-observer-github, defaultMode: 0440}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ci-observer}
---
apiVersion: v1
kind: Service
metadata: {name: ci-observer}
spec:
  selector: {app.kubernetes.io/name: ci-observer}
  ports: [{name: metrics, port: 9103, targetPort: metrics}]
