---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: ci-observer, namespace: zuul}
rules:
  - apiGroups: ['']
    resources: [pods, pods/log]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ci-observer, namespace: zuul}
subjects:
  - {kind: ServiceAccount, name: ci-observer, namespace: zuul}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ci-observer}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: ci-observer, namespace: zuul-executor}
rules:
  - apiGroups: ['']
    resources: [pods, pods/log]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ci-observer, namespace: zuul-executor}
subjects:
  - {kind: ServiceAccount, name: ci-observer, namespace: zuul}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ci-observer}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: ci-observer, namespace: build-farm}
rules:
  - apiGroups: ['']
    resources: [pods, pods/log]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ci-observer, namespace: build-farm}
subjects:
  - {kind: ServiceAccount, name: ci-observer, namespace: zuul}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ci-observer}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ci-observer-api, namespace: zuul}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ci-observer}
  policyTypes: [Egress, Ingress]
  egress:
    - to: [{ipBlock: {cidr: 172.31.250.10/32}}]
      ports: [{protocol: TCP, port: 6443}]
    - to: [{ipBlock: {cidr: 172.31.250.2/32}}]
      ports: [{protocol: TCP, port: 3128}]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: build-farm}
          podSelector:
            matchLabels: {app.kubernetes.io/name: farm-prometheus}
      ports: [{protocol: TCP, port: 9103}]
