# Zuul's configuration (https://zuul-ci.org/docs/zuul/latest/configuration.html), the same file for
# every Zuul service: the scheduler, web and launcher in zuul (deploy/zuul/server/), and the executor in
# zuul-executor (deploy/zuul/executor/). Each reads only its own sections and the shared ones.
#
# No secrets here. %(ZUUL_...)s is read from the service's environment, which takes it from a
# Secret (deploy/zuul/secrets.sh); Zuul offers only variables whose names start with ZUUL_.

[zookeeper]
# One ZooKeeper, over TLS with a client certificate (deploy/zuul/README.md, "ZooKeeper").
hosts=zookeeper.zuul.svc.cluster.local:2281
tls_cert=/etc/zuul-tls/tls.crt
tls_key=/etc/zuul-tls/tls.key
tls_ca=/etc/zuul-tls/ca.crt

[keystore]
# Encrypts the project keys Zuul keeps in ZooKeeper. Losing it loses the keys, and with them
# every secret encrypted for a project (deploy/zuul/README.md, "What persists").
password=%(ZUUL_KEYSTORE_PASSWORD)s

[database]
dburi=mariadb+pymysql://zuul:%(ZUUL_DB_PASSWORD)s@db.zuul.svc.cluster.local/zuul

[scheduler]
tenant_config=/etc/zuul/main.yaml
prometheus_port=9091

[web]
listen_address=0.0.0.0
port=9000
# Where report links point: AID's Zuul UI (apps/zuul-ui/, ../../web.md), https://<AID's host>:<its port>/. From the
# Secret zuul-web (../../secrets.sh web), since the host is the tailnet's. Only the scheduler, which writes the reports,
# and web read it.
root=%(ZUUL_WEB_ROOT)s
prometheus_port=9091

[auth admin]
# zuul-web's admin API (enqueue, dequeue, promote, autohold): a token signed with this secret, made in web's pod by
# ../../admin-api.sh, and the tenant's admin rule admin-token (main.yaml), which matches this issuer. The secret is the
# Secret zuul-web-admin's (../../secrets.sh web-admin), given to web alone: only web reads [auth] sections, and
# zuul-admin create-auth-token in its pod (Zuul 14.3.0: zuul/lib/auth.py, zuul/cmd/client.py). No browser signs in
# with it (the web UI signs in only to an OpenIDConnect realm), and AID's Zuul UI passes no POST (../../web.md).
driver=HS256
realm=aid-admin
issuer_id=zuul-admin-aid
client_id=zuul-web-aid
secret=%(ZUUL_ADMIN_SECRET)s
# A token carries no zuul.admin claim: only the admin rule says what it may do.
allow_authz_override=false
# Older tokens are refused whatever their exp says. admin-api.sh's last 300 seconds.
max_validity_time=600

[executor]
# The name zuul-web reaches the executor by for a running build's log: its pod's DNS name in the
# StatefulSet's headless Service (zuul-executor/executor.yaml).
hostname=%(ZUUL_EXECUTOR_HOSTNAME)s
state_dir=/var/lib/zuul
# The executor also merges: there is no separate merger (deploy/zuul/README.md, "How many of each").
merge_jobs=true
# On SIGTERM, take no new builds and finish the running ones, within the pod's grace period.
sigterm_method=graceful
prometheus_port=9091
# The build logs (../../web.md, "The logs"): trusted playbooks, the base job's, see the log store and may write to
# it, and see the script that copies a build's logs there. Untrusted playbooks see neither.
trusted_ro_paths=/etc/zuul-executor
trusted_rw_paths=/srv/zuul-logs

[merger]
# The author of the merge commits Zuul makes to test a change on top of its branch; they are
# never pushed.
git_user_name=Zuul
git_user_email=zuul@zuul.invalid

[launcher]
prometheus_port=9091

[statsd]
# Every service's statistics, the pipelines' lengths and times among them, to the exporter that turns them into
# Prometheus metrics (../metrics.yaml, ../../web.md, "Metrics"). UDP: nothing waits for it.
server=metrics.zuul.svc.cluster.local
port=9125

[connection "github"]
# AID's repositories on GitHub, through the GitHub App aid-zuul (deploy/zuul/github.md): its ID, its private key
# and the webhook secret it signs each delivery with, from the Secret zuul-github (deploy/zuul/secrets.sh github).
# Deliveries reach zuul-web at /api/connection/github/payload, through Zuul's own Funnel and forwarder (github.md, "Webhooks").
driver=github
app_id=%(ZUUL_GITHUB_APP_ID)s
app_key=/etc/zuul-github/app-key.pem
webhook_token=%(ZUUL_GITHUB_WEBHOOK_TOKEN)s

# Existing check/gate/post/staging providers remain static until the separate cutover is released.
[connection "aid-nodes"]
driver=static

# The launcher uses existing admin-bounded namespaces, never cluster-wide rights.
[connection "aid-check-pods"]
driver=kubernetes
namespace=zuul-nodes

[connection "aid-gate-pods"]
driver=kubernetes
namespace=zuul-gate

[connection "aid-gate-compute-pods"]
driver=kubernetes
namespace=zuul-gate-compute

[connection "aid-post-pods"]
driver=kubernetes
namespace=zuul-post

[connection "opendev.org"]
# Zuul's own job library, public, read over HTTPS.
driver=git
baseurl=https://opendev.org

[connection "aid-events"]
# Optional native MQTT reporting to AID (#1349), never a build prerequisite (events/README.md).
# publish() queues without waiting for an ACK, logs/drops while disconnected and catches publish errors.
# Provision events/ before enabling the companion pipeline reporters.
# The scheduler authenticates with its existing CA-signed client certificate, not a job secret or a forge token.
driver=mqtt
server=172.31.250.14
port=8883
ca_certs=/etc/zuul-tls/ca.crt
certfile=/etc/zuul-tls/tls.crt
keyfile=/etc/zuul-tls/tls.key
