# Which of AID's jobs run in which pipeline (https://zuul-ci.org/docs/zuul/latest/config/project.html). The pipelines
# are trusted (kristofk/aid-zuul-config); this list is not, so a pull request that adds a job here runs
# it on itself.
- project:
    check:
      jobs:
        - aid-seam-lint
    # Anyone's pull request, on a maintainer's comment (deploy/zuul/github.md, "Who makes Zuul run what"): the same
    # jobs as check, which get no secret and no farm there.
    check-external:
      jobs:
        - aid-seam-lint
    gate:
      jobs:
        - aid-seam-lint
