# AID's jobs (https://zuul-ci.org/docs/zuul/latest/config/job.html). Untrusted: a pull request that changes this file,
# a playbook or a role under ci/zuul/playbooks/, or a script they run, is tested with its own changes
# (ci/zuul/README.md, "Adding or changing a job").
#
# The library: two abstract jobs, one for a Bazel command and one for a script from the repository. Every job of AID's
# is one of them with its variables set. Each inherits `base` (kristofk/aid-zuul-config), which checks the
# code out; neither holds build logic, which stays in Bazel and in the scripts.

- job:
    name: aid-bazel
    abstract: true
    description: |
      Runs one Bazel command in the checkout: `bazel <bazel_startup_flags> <bazel_command> <bazel_flags> -- <bazel_targets>`.
    run: ci/zuul/playbooks/bazel.yaml
    vars:
      bazel_command: test
      bazel_startup_flags: []
      bazel_flags: []
      bazel_targets: ["//..."]

- job:
    name: aid-script
    abstract: true
    description: |
      Runs one script from the repository in the checkout: `<script> <script_args>`, where `script` is a path under
      ci/ or scripts/.
    run: ci/zuul/playbooks/script.yaml
    vars:
      script_args: []

# AID's own jobs. The cheap ones (check) are the plan job's checks of CI's cheap layer; the full ones (gate) are its
# expensive layer, the merge queue's run (#1521, gate.md, "The gate's jobs"). Build logic stays in repository scripts
# (#1341).

- job:
    name: aid-seam-lint
    parent: aid-script
    description: The seam rule (CLAUDE.md), as CI's seam-lint step runs it.
    timeout: 600
    vars:
      script: scripts/seam-lint.sh
      script_args: [--project, aid]

- job:
    name: aid-seam-lint-test
    parent: aid-script
    description: The seam check itself catches a sibling's name in any letter case.
    timeout: 600
    vars:
      script: scripts/seam-lint-test.sh

- job:
    name: aid-apps-lint
    parent: aid-script
    description: Nothing in Packages/ or Sources/ names an application under apps/.
    timeout: 600
    vars:
      script: scripts/apps-lint.sh

- job:
    name: aid-apps-lint-test
    parent: aid-script
    description: The apps check itself fails on a planted reference.
    timeout: 600
    vars:
      script: scripts/apps-lint-test.sh

- job:
    name: aid-cheap-checks
    parent: aid-script
    description: |
      Quarantine validation, CI/workflow policy, legacy capture, and affected Node suites through Bazel on the farm,
      with a pinned Node runtime, extraction, quarantine behavior and Bazel test caching. A failure of any check or selected suite fails aid/check (#1520).
    timeout: 1800
    vars:
      script: ci/zuul/cheap.mjs
      script_args: ["{{ zuul.branch }}"]

- job:
    name: aid-bazel-everything
    parent: aid-bazel
    # The compute pool preserves the 6 GiB limit for the unchanged 3 GiB heap.
    nodeset: aid-gate-compute
    description: |
      Builds and tests everything with a BUILD file, as CI's `bazel` job does in the merge queue's run, within the
      base job's 2-hour timeout (ci/zuul/gate.md, "Timeouts"), when the gate's plan names it.
    dependencies: [aid-gate-plan]
    vars:
      bazel_command: test
      # #1842: the full OCI graph needs more than the default 25% heap.
      # The selected compute node leaves 3 GiB outside heap; no pod budget change.
      bazel_startup_flags: ["--host_jvm_args=-Xmx3g"]
      # On the build farm, from a node with no compiler (#1345): .bazelrc's `zuul`, the farm by the cluster's address,
      # the workers' installed toolchains and no local fallback, under `dev`; main gets its own nodes (#1351).
      # Keep pre-breaker RPC errors and the selected targets' actual outcomes with the job logs (#1719).
      # Raw diagnostics stay on the node; bazel-job.py exports only bounded test XML/logs and
      # compressed diagnostics to the trusted fetch root (#1893). Never copy OCI layouts/runfiles.
      # No credential-helper output or HTTP headers are logged.
      bazel_flags:
        - --config=ci
        - --config=zuul
        # Explicitly pin the node rc's existing minimal-output policy: image outputs stay on the farm.
        - --remote_download_minimal
        # A disposable full-graph client otherwise retains downloaded blobs as well as
        # extracted repositories/toolchains in its 11 GiB home (#1867).
        - "--repository_cache="
        - "--repo_contents_cache="
        # Read immutable shared downloads without a duplicate writable blob archive.
        - "--distdir={{ ansible_user_dir }}/zuul-shared-distdir"
        # rules_oci asks for an uncached token before reading seeded blobs. A 429
        # there may fall back to anonymous reads; unseeded/private blobs still fail.
        - --repo_env=OCI_GET_TOKEN_ALLOW_FAIL=1
        - "--remote_grpc_log={{ ansible_user_dir }}/zuul-bazel-diagnostics/remote-rpc.pb"
        # Compact logging streams deduplicated, zstd-compressed records instead of
        # retaining/sorting a multi-GiB JSON execution log at command completion.
        - "--execution_log_compact_file={{ ansible_user_dir }}/zuul-bazel-diagnostics/execution.log"
        - "--build_event_json_file={{ ansible_user_dir }}/zuul-bazel-diagnostics/build-events.jsonl"
        # Keep BEP emission independent of an unavailable remote uploader.
        - --nobuild_event_json_file_path_conversion
      bazel_targets: ["//..."]

# One tenant-wide slot for complete scratch producer/consumer lifetimes and maintenance.
# Trusted post/maintenance jobs must use this same name; see ../scratch-retention.md.
- semaphore:
    name: aid-scratch-registry
    max: 1

# The gate (#1521, gate.md, "The gate's jobs"): CI's queue layer, each of its steps a job, with ci/zuul/gate.sh running
# the step's commands. aid-gate-plan plans the change as ci.yml's plan job does (ci/zuul/gate.mjs), and every other job
# of gate depends on it: Zuul runs those it names and skips the rest. One that runs and fails, times out or gets no node
# fails the gate.
- job:
    name: aid-gate
    parent: aid-script
    nodeset: aid-gate-compute
    abstract: true
    description: |
      One step of CI's queue layer: `ci/zuul/gate.sh <build> <branch> <step> [<name>]`.
    vars:
      script: ci/zuul/gate.sh

# The image jobs' node (deploy/zuul/gate-node/): the build farm, scratch registry and image-check namespace,
# and no publishing secret. The projected aid-build-farm token uses exact subjects:
# exact zuul-gate:gate maps to zuul-gate/dev; only trusted zuul-post:post maps to zuul-post/main.
# The PR identity stays zuul-pr/dev. Revoke these independently in farm-revoked. #1733 prepares
# the routes/tokens without changing consumers; the orchestrator alone releases the cutover hold.
# The staging node (deploy/zuul/staging-node/): Docker with compose.
# Gate compute is separate from check admission and scratch-image jobs.
- nodeset:
    name: aid-gate-compute
    nodes:
      - name: node
        label: aid-gate-compute-pod-node

- nodeset:
    name: aid-gate-image
    nodes:
      - name: node
        label: aid-gate-pod-node

# #1939: nightly shares #1867/#1926 compute capacity, separate from the image pod.
- nodeset:
    name: aid-nightly-compute
    nodes:
      - name: node
        label: aid-gate-compute-pod-node

- nodeset:
    name: aid-staging
    nodes:
      - name: node
        label: aid-staging-node

- job:
    name: aid-gate-plan
    parent: aid-gate
    description: |
      The quarantine list is valid, and the change's plan (ci/affected.mjs, as ci.yml's plan job reads it for the
      merge queue's run) names the jobs of gate that run; Zuul skips the others.
    run: ci/zuul/playbooks/gate-plan.yaml
    timeout: 600
    vars:
      script_args: ["{{ zuul.build }}", "{{ zuul.branch }}", plan]

- job:
    name: aid-bazel-graph
    parent: aid-gate
    description: Every first-party dependency follows the architecture (ci/bazel-graph.mjs), as CI's `bazel` job checks it.
    dependencies: [aid-gate-plan]
    timeout: 1800
    vars:
      script_args: ["{{ zuul.build }}", "{{ zuul.branch }}", graph]

- job:
    name: aid-gate-ingress
    parent: aid-gate
    description: |
      `aid` built on the build farm, and the ingress suite (ci/ingress-suite.sh) on the PR node, whole or the part the
      plan names, as CI's `ingress` job runs it.
    dependencies: [aid-gate-plan]
    timeout: 3600
    vars:
      script_args: ["{{ zuul.build }}", "{{ zuul.branch }}", ingress]

- job:
    name: aid-gate-image-beeper
    parent: aid-gate
    description: The image of beeper, built and checked as its app workflow and post build and check it.
    dependencies: [aid-gate-plan]
    nodeset: aid-gate-image
    semaphores:
      - name: aid-scratch-registry
        resources-first: true
    post-run:
      - name: ci/zuul/playbooks/scratch-cleanup.yaml
