# The nightly full run (#1350, ci/zuul/publish.md, "The nightly"), in periodic-0200 and periodic-0300: Bazel's build and test of everything,
# with no cached test result, once a night at 04:00 in Madrid, when ci/publisher names Zuul. Its result reaches the
# ci-nightly issue through aid-zuul-config's aid-nightly-report, which has the token this job never gets.
- job:
    name: aid-nightly
    parent: aid-script
    # The simulator needs >=4 GiB. Use #1867's 6 GiB compute pod, never the
    # gate image slot. #1926 activated this pool before the nightly routing release.
    nodeset: aid-nightly-compute
    description: |
      Everything with a BUILD file plus the isolated real-Bazel client simulator, on main's head, with the
      clock of ci/nightly.mjs: of the two periodic pipelines, only the one whose time is 04:00 in Madrid runs it.
    vars:
      script: ci/zuul/publish/nightly.sh
      script_args: ["{{ zuul.pipeline }}", "{{ zuul.branch }}"]
