# The quarantine runs (#226): they block nothing, as on GitHub Actions.
- job:
    name: aid-gate-quarantine-swift
    parent: aid-gate
    description: Each Swift package that holds a quarantined test, whole and uncached, and the quarantined tests' results.
    dependencies: [aid-gate-plan]
    voting: false
    timeout: 5400
    vars:
      script_args: ["{{ zuul.build }}", "{{ zuul.branch }}", quarantine-swift]

- job:
    name: aid-gate-quarantine-node
    parent: aid-gate
    description: Each Node suite that holds a quarantined test, whole, and the quarantined tests' results.
    dependencies: [aid-gate-plan]
    voting: false
    timeout: 1800
    vars:
      script_args: ["{{ zuul.build }}", "{{ zuul.branch }}", quarantine-node]

# The nightly full run (#1350, ci/zuul/publish.md, "The nightly"), in periodic-0200 and periodic-0300: Bazel's build and test of everything,
# with no cached test result, once a night at 04:00 in Madrid, when ci/publisher names Zuul. Its result reaches the
# ci-nightly issue through aid-zuul-config's aid-nightly-report, which has the token this job never gets.
- job:
    name: aid-nightly
    parent: aid-script
    description: |
      Everything with a BUILD file, built and tested on main's head, as the nightly does on GitHub Actions, with the
      clock of ci/nightly.mjs: of the two periodic pipelines, only the one whose time is 04:00 in Madrid runs it.
    vars:
      script: ci/zuul/publish/nightly.sh
      script_args: ["{{ zuul.pipeline }}", "{{ zuul.branch }}"]
