# AID's jobs (https://zuul-ci.org/docs/zuul/latest/config/job.html). Untrusted: a pull request that changes this file,
# a playbook or a role under ci/zuul/playbooks/, or a script they run, is tested with its own changes
# (ci/zuul/README.md, "Adding or changing a job").
#
# The library: two abstract jobs, one for a Bazel command and one for a script from the repository. Every job of AID's
# is one of them with its variables set. Each inherits `base` (kristofk/aid-zuul-config), which checks the
# code out; neither holds build logic, which stays in Bazel and in the scripts.

- job:
    name: aid-bazel
    abstract: true
    description: |
      Runs one Bazel command in the checkout: `bazel <bazel_command> <bazel_flags> -- <bazel_targets>`.
    run: ci/zuul/playbooks/bazel.yaml
    vars:
      bazel_command: test
      bazel_flags: []
      bazel_targets: ["//..."]

- job:
    name: aid-script
    abstract: true
    description: |
      Runs one script from the repository in the checkout: `<script> <script_args>`, where `script` is a path under
      ci/ or scripts/.
    run: ci/zuul/playbooks/script.yaml
    vars:
      script_args: []

# AID's own jobs. The cheap ones (check) are the plan job's checks of CI's cheap layer; the full ones (gate) are its
# expensive layer, the merge queue's run (#1521, gate.md, "The gate's jobs"). Build logic stays in repository scripts
# (#1341).

- job:
    name: aid-seam-lint
    parent: aid-script
    description: The seam rule (CLAUDE.md), as CI's seam-lint step runs it.
    timeout: 600
    vars:
      script: scripts/seam-lint.sh
      script_args: [--project, aid]

- job:
    name: aid-seam-lint-test
    parent: aid-script
    description: The seam check itself catches a sibling's name in any letter case.
    timeout: 600
    vars:
      script: scripts/seam-lint-test.sh

- job:
    name: aid-apps-lint
    parent: aid-script
    description: Nothing in Packages/ or Sources/ names an application under apps/.
    timeout: 600
    vars:
      script: scripts/apps-lint.sh

- job:
    name: aid-apps-lint-test
    parent: aid-script
    description: The apps check itself fails on a planted reference.
    timeout: 600
    vars:
      script: scripts/apps-lint-test.sh

- job:
    name: aid-cheap-checks
    parent: aid-script
    description: |
      Quarantine validation, CI/workflow policy, legacy capture, and the affected Node suites, with Actions' commands
      and quarantine behavior. A failure of any check or selected suite fails aid/check (#1520).
    timeout: 1800
    vars:
      script: ci/zuul/cheap.mjs
      script_args: ["{{ zuul.branch }}"]

- job:
    name: aid-bazel-everything
    parent: aid-bazel
    description: |
      Builds and tests everything with a BUILD file, as CI's `bazel` job does in the merge queue's run, within the
      base job's 2-hour timeout (ci/zuul/gate.md, "Timeouts"), when the gate's plan names it.
    dependencies: [aid-gate-plan]
    vars:
      bazel_command: test
      # On the build farm, from a node with no compiler (#1345): .bazelrc's `zuul`, the farm by the cluster's address,
      # the workers' installed toolchains and no local fallback, under `dev`; main gets its own nodes (#1351).
      bazel_flags: [--config=ci, --config=zuul]
      bazel_targets: ["//..."]

# The gate (#1521, gate.md, "The gate's jobs"): CI's queue layer, each of its steps a job, with ci/zuul/gate.sh running
# the step's commands. aid-gate-plan plans the change as ci.yml's plan job does (ci/zuul/gate.mjs), and every other job
# of gate depends on it: Zuul runs those it names and skips the rest. One that runs and fails, times out or gets no node
# fails the gate.
- job:
    name: aid-gate
    parent: aid-script
    abstract: true
    description: |
      One step of CI's queue layer: `ci/zuul/gate.sh <build> <branch> <step> [<name>]`.
    vars:
      script: ci/zuul/gate.sh

# The image jobs' node (deploy/zuul/gate-node/): its own BuildKit, the scratch registry and the image-check namespace,
# and no secret and no farm token. The staging node (deploy/zuul/staging-node/): Docker with compose.
- nodeset:
    name: aid-gate-image
    nodes:
      - name: node
        label: aid-gate-node

- nodeset:
    name: aid-staging
    nodes:
      - name: node
        label: aid-staging-node

- job:
    name: aid-gate-plan
    parent: aid-gate
    description: |
      The quarantine list is valid, and the change's plan (ci/affected.mjs, as ci.yml's plan job reads it for the
      merge queue's run) names the jobs of gate that run; Zuul skips the others.
    run: ci/zuul/playbooks/gate-plan.yaml
    timeout: 600
    vars:
      script_args: ["{{ zuul.build }}", "{{ zuul.branch }}", plan]

- job:
    name: aid-bazel-graph
    parent: aid-gate
    description: Every first-party dependency follows the architecture (ci/bazel-graph.mjs), as CI's `bazel` job checks it.
    dependencies: [aid-gate-plan]
    timeout: 1800
    vars:
      script_args: ["{{ zuul.build }}", "{{ zuul.branch }}", graph]

- job:
    name: aid-gate-ingress
    parent: aid-gate
    description: |
      `aid` built on the build farm, and the ingress suite (ci/ingress-suite.sh) on the PR node, whole or the part the
      plan names, as CI's `ingress` job runs it.
    dependencies: [aid-gate-plan]
    timeout: 3600
    vars:
      script_args: ["{{ zuul.build }}", "{{ zuul.branch }}", ingress]

