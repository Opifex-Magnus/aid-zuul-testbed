# AID's jobs (https://zuul-ci.org/docs/zuul/latest/config/job.html). Untrusted: a pull request that changes this file,
# a playbook or a role under ci/zuul/playbooks/, or a script they run, is tested with its own changes
# (ci/zuul/README.md, "Adding or changing a job").
#
# The library: two abstract jobs, one for a Bazel command and one for a script from the repository. Every job of AID's
# is one of them with its variables set. Each inherits `base` (kristofk/aid-zuul-config), which checks the
# code out; neither holds build logic, which stays in Bazel and in the scripts.

- job:
    name: aid-bazel
    abstract: true
    description: |
      Runs one Bazel command in the checkout: `bazel <bazel_command> <bazel_flags> -- <bazel_targets>`.
    run: ci/zuul/playbooks/bazel.yaml
    vars:
      bazel_command: test
      bazel_flags: []
      bazel_targets: ["//..."]

- job:
    name: aid-script
    abstract: true
    description: |
      Runs one script from the repository in the checkout: `<script> <script_args>`, where `script` is a path under
      ci/ or scripts/.
    run: ci/zuul/playbooks/script.yaml
    vars:
      script_args: []

# AID's own jobs. The cheap ones (check) are the plan job's script checks of CI's cheap layer; the full one (gate) is
# its expensive layer's Bazel build and test. The rest of CI's steps come as jobs of the same two kinds (#1353).

- job:
    name: aid-seam-lint
    parent: aid-script
    description: The seam rule (CLAUDE.md), as CI's seam-lint step runs it.
    timeout: 600
    vars:
      script: scripts/seam-lint.sh
      script_args: [--project, aid]

- job:
    name: aid-seam-lint-test
    parent: aid-script
    description: The seam check itself catches a sibling's name in any letter case.
    timeout: 600
    vars:
      script: scripts/seam-lint-test.sh

- job:
    name: aid-apps-lint
    parent: aid-script
    description: Nothing in Packages/ or Sources/ names an application under apps/.
    timeout: 600
    vars:
      script: scripts/apps-lint.sh

- job:
    name: aid-apps-lint-test
    parent: aid-script
    description: The apps check itself fails on a planted reference.
    timeout: 600
    vars:
      script: scripts/apps-lint-test.sh

- job:
    name: aid-bazel-everything
    parent: aid-bazel
    description: |
      Builds and tests everything with a BUILD file, as CI's `bazel` job does in the merge queue's run, within the
      base job's 2-hour timeout (ci/zuul/gate.md, "Timeouts").
    vars:
      bazel_command: test
      # On the build farm, from a node with no compiler (#1345): .bazelrc's `zuul`, the farm by the cluster's address,
      # the hermetic toolchain and no local fallback, under `dev`; the gate's `main` comes with its own nodes (#1351).
      bazel_flags: [--config=ci, --config=zuul]
      bazel_targets: ["//..."]
