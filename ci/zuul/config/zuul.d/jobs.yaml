# The base job (https://zuul-ci.org/docs/zuul/latest/config/job.html), which every job inherits. Trusted: only a
# config project may define a job with no parent, and its playbooks run outside the sandbox that untrusted
# playbooks get. Keep it to what every job needs before and after its own run, and nothing that builds.

- job:
    name: base
    parent: null
    description: |
      Every job's parent. Starts the console stream and puts the change under test, merged onto its branch and
      onto the changes ahead of it, into the node's workspace (~/src/<host>/<owner>/<repository>).
    pre-run: ci/zuul/config/playbooks/base/pre.yaml
    roles:
      - zuul: zuul/zuul-jobs
    # Today's checks time out after 2 hours (docs/development.md); a job sets less if it needs less.
    timeout: 7200
    nodeset:
      nodes:
        # The build node (#1345): Bazelisk, git and the scripts' tools. The launcher's provider for the label comes
        # with #1345.
        - name: node
          label: aid-node
