# The run playbook of the test bed's jobs with a secret (secret-probe.yaml), as playbooks/testbed/secret-probe.yaml in
# the config project's copy: what reached the job, as a hash, in the log and as the build's artifact, as the release's
# credential check returns its own. The scenario compares both with the fixture's.
- hosts: localhost
  gather_facts: false
  tasks:
    - name: What reached the job
      ansible.builtin.debug:
        msg: "testbed secret sha256 {{ testbed_secret.value | hash('sha256') }}"
    - name: What reached the job, as the build's artifact
      zuul_return:
        data:
          zuul:
            artifacts:
              - name: testbed-secret
                url: https://zuul.invalid/testbed-secret
                metadata:
                  sha256: "{{ testbed_secret.value | hash('sha256') }}"
