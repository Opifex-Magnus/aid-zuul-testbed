# The GitLab test bed's connections (../../forge.md, "The check on GitLab"), which run.sh appends to the deployment's
# zuul.conf (deploy/zuul/server/config/zuul.conf) in place of its GitHub App and its MQTT broker.

[connection "gitlab"]
# GitLab CE in Compose (compose.yaml), as the user zuul, a Maintainer of both projects, with a token setup.py made. The
# connection's name is what the pipelines' triggers and reporters say (pipelines.yaml); its server is the hostname in
# each project's canonical name (gitlab/aid/aidepartment) and in the node's workspace (~/src/gitlab/...).
driver=gitlab
server=gitlab
baseurl=http://gitlab
# Zuul's mergers clone over HTTP as http://zuul:<token>@gitlab/<project>.git.
api_token_name=zuul
api_token=%(ZUUL_GITLAB_TOKEN)s
# Each project's webhook sends it as X-Gitlab-Token.
webhook_token=%(ZUUL_WEBHOOK_TOKEN)s

[connection "static"]
driver=static

[connection "aid-events"]
driver=mqtt
server=events
port=1883
