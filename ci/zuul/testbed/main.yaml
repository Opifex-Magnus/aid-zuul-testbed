# The test bed's tenant (../README.md, "The test bed"): the layout of ci/zuul/ as ThunderBox's tenant takes it, read
# from the test bed's repository, @REPOSITORY@, which run.sh puts in. The same repository twice: from the git
# connection aid-config as the config project (trusted, from main only), and from the GitHub connection as AID's own
# project (untrusted, and tested speculatively).
- tenant:
    name: aid
    source:
      aid-config:
        config-projects:
          - @REPOSITORY@:
              load-branch: main
              extra-config-paths:
                - ci/zuul/config/zuul.d/
                # The test bed's build node.
                - ci/zuul/testbed/zuul.d/
      github:
        untrusted-projects:
          - @REPOSITORY@:
              extra-config-paths:
                - ci/zuul/zuul.d/
      opendev.org:
        untrusted-projects:
          - zuul/zuul-jobs:
              include:
                - job
