# The test bed's connections (../README.md, "The test bed"), which run.sh appends to the deployment's zuul.conf
# (deploy/zuul/server/config/zuul.conf). On ThunderBox, #1344 brings the GitHub connection, with Zuul's GitHub App.

[connection "github"]
# The test bed's two repositories, with the run's GitHub token. The test bed sends Zuul the events GitHub would.
driver=github
api_token=%(ZUUL_GITHUB_TOKEN)s
webhook_token=%(ZUUL_WEBHOOK_TOKEN)s

[connection "static"]
driver=static
