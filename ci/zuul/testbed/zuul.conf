# The test bed's connections (../README.md, "The test bed"), which run.sh appends to the deployment's zuul.conf
# (deploy/zuul/server/config/zuul.conf). On ThunderBox, #1344 brings the GitHub connection and the config project's.

[connection "github"]
# The test bed's own repository, with the run's GitHub token. The test bed sends Zuul the events GitHub would.
driver=github
api_token=%(ZUUL_GITHUB_TOKEN)s
webhook_token=%(ZUUL_WEBHOOK_TOKEN)s

[connection "aid-config"]
# The same repository as the config project, read over git under a host name and a project name of its own, so that
# Zuul counts it as a second project (ci/zuul/README.md, "One repository, two projects"). The owner is in the base
# URL: Zuul 14.3.0 looks a playbook's project up by its name alone, so the two names must differ. run.sh puts it in.
driver=git
baseurl=https://github.com/@OWNER@
canonical_hostname=aid-config
poll_delay=20

[connection "static"]
driver=static
