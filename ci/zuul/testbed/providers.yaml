# The test bed's build node (compose.yaml's `node`), for the label the base job asks for. sync.sh puts it into the
# config project's copy, as testbed/providers.yaml, which only the test bed's tenant reads (main.yaml); on ThunderBox
# the label's provider comes with #1345, in kristofk/aid-zuul-config.
- image:
    name: testbed-node
    type: cloud

- flavor:
    name: testbed

- label:
    name: aid-node
    image: testbed-node
    flavor: testbed

- section:
    name: testbed
    connection: static
    flavors:
      - name: testbed

- provider:
    name: testbed
    section: testbed
    nodes:
      - name: node
        label: aid-node
        connection-port: 22
    labels:
      - name: aid-node
    images:
      - name: testbed-node
        python-path: /usr/bin/python3
        username: zuul
