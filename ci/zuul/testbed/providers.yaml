# The test bed's two check nodes and separate two compute nodes (compose.yaml).
# Check uses trusted base's label; non-image gate uses its dedicated compute label. sync.sh puts
# them into the config project's copy, as testbed/providers.yaml, which only the test bed's tenant reads (main.yaml); on
# ThunderBox the label's provider comes with #1345, in kristofk/aid-zuul-config.
- image:
    name: testbed-node
    type: cloud

- flavor:
    name: testbed

- label:
    name: aid-check-pod-node
    image: testbed-node
    flavor: testbed

- label:
    name: aid-gate-compute-pod-node
    image: testbed-node
    flavor: testbed

# The labels of the gate's image and staging nodes (ci/zuul/zuul.d/jobs.yaml's nodesets aid-gate-image and aid-staging),
# with no node: the plan's stand-in names none of their jobs (sync.sh), so Zuul skips them and asks for no such node.
- label:
    name: aid-gate-pod-node
    image: testbed-node
    flavor: testbed

- label:
    name: aid-staging-node
    image: testbed-node
    flavor: testbed

- section:
    name: testbed
    connection: static
    flavors:
      - name: testbed

- provider:
    name: testbed
    section: testbed
    # node and node-2 serve check. The separate compute nodes below support
    # the testbed's gate window of two without consuming either check node.
    nodes:
      - name: node
        label: aid-check-pod-node
        connection-port: 22
      - name: node-2
        label: aid-check-pod-node
        connection-port: 22
      # Separate nodes, not aliases of either check node. Two only for the
      # testbed window=2 scenario; production provider is one non-reusable pod.
      - name: gate-compute
        label: aid-gate-compute-pod-node
        connection-port: 22
      - name: gate-compute-2
        label: aid-gate-compute-pod-node
        connection-port: 22
    labels:
      - name: aid-check-pod-node
      - name: aid-gate-compute-pod-node
    images:
      - name: testbed-node
        python-path: /usr/bin/python3
        username: zuul
