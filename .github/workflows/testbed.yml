# The test bed's workflow (../README.md, "The test bed"). sync.sh copies it into the test bed's repository as
# .github/workflows/testbed.yml; it runs only when dispatched: gh workflow run testbed.yml --repo <owner>/<name>
# (with -f loop_pull=<n> for the two-agent loop's run, ../README.md, "The two-agent loop on the test bed").
name: Zuul test bed
on:
  workflow_dispatch:
    inputs:
      loop_pull:
        description: The builder's pull request for the two-agent loop's check (13) alone; empty runs checks 1 to 12
        required: false
        default: ""
      issue_closing_only:
        description: Check the pinned driver's rebase merge closes issues, without the Compose scenarios
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  # Zuul reads the pull request's check runs.
  checks: read
concurrency:
  group: testbed
  cancel-in-progress: false
jobs:
  testbed:
    if: ${{ !inputs.issue_closing_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The layout of ci/zuul/ on Zuul
        run: ci/zuul/testbed/run.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TESTBED_REPOSITORY: ${{ github.repository }}
          TESTBED_LOOP_PULL: ${{ inputs.loop_pull }}
  issue-closing:
    if: ${{ inputs.issue_closing_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rebase merge closes the keyword-linked issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TESTBED_REPOSITORY: ${{ github.repository }}
        run: |
          source ci/zuul/testbed/testbed.env
          docker run --rm --entrypoint python3 -e GITHUB_TOKEN -e TESTBED_REPOSITORY \
            --mount "type=bind,src=$PWD/ci/zuul/testbed,dst=/probe,readonly" \
            "$ZUUL_SCHEDULER_IMAGE" -I -B /probe/issue_closing.py
